name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Validate catalog and tracker behavior
        run: dotnet run --project tools/Checks --configuration Release -- .
      - name: Check browser scripts
        run: |
          node --check pokedex_tracker/wwwroot/app.js
          node --check pokedex_tracker/wwwroot/service-worker.published.js
          node --check tools/browser-checks.js
          node --check tools/browser-ui-checks.js
          node --check tools/browser-catalog-checks.js
      - name: Publish standalone app
        run: dotnet publish pokedex_tracker -c Release -o artifacts/publish
      - name: Prepare repository path and offline cache
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: dotnet run --project tools/Publish -c Release -- artifacts/publish/wwwroot "/$REPOSITORY_NAME/"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/publish/wwwroot
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
