name: Build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    name: Catalog and tracker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Compile catalog generator
        run: dotnet build tools/CatalogGenerator --configuration Release
      - name: Verify evolution coverage and reproducibility
        run: dotnet run --project tools/CatalogGenerator --configuration Release -- . --verify-evolutions
      - name: Validate catalog and tracker behavior
        run: dotnet run --project tools/Checks --configuration Release -- .
  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check application and browser verification scripts
        run: |
          for script in pokedex_tracker/wwwroot/*.js tools/browser-*.js; do
            node --check "$script"
          done
          for script in tools/*.mjs; do
            node --check "$script"
          done
      - name: Check appearance preference behavior
        run: node --test tools/preferences-checks.mjs
  publish:
    name: Release publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Install WebAssembly build tools
        run: dotnet workload install wasm-tools
      - name: Publish standalone app
        run: dotnet publish pokedex_tracker -c Release -o artifacts/publish
      - name: Prepare repository path and offline cache
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: dotnet run --project tools/Publish -c Release -- artifacts/publish/wwwroot "/$REPOSITORY_NAME/"
      - name: Verify published browser behavior and offline reopening
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: node tools/browser-ci.mjs artifacts/publish/wwwroot "/$REPOSITORY_NAME/"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/publish/wwwroot
  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [catalog, javascript, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
